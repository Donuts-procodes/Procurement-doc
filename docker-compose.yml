services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: procurement_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/rfq_db
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - MILVUS_URI=http://milvus:19530
      - LOCAL_TEMPLATES_DIR=/app/templates_storage
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend:/app
      - ./templates_storage:/app/templates_storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      milvus:
        condition: service_started
    networks:
      - procurement_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: procurement_frontend
    restart: unless-stopped
    user: "0:0"
    command: npm run dev
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - procurement_net

  postgres:
    image: postgres:15-alpine
    container_name: procurement_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=rfq_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rfq_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - procurement_net

  redis:
    image: redis:alpine
    container_name: procurement_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - procurement_net

  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: procurement_milvus
    command: ["milvus", "run", "standalone"]
    restart: unless-stopped
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - COMMON_STORAGETYPE=local
    ports:
      - "19531:19530"
      - "9095:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - procurement_net

volumes:
  postgres_data:
  redis_data:
  milvus_data:

networks:
  procurement_net:
    driver: bridge
