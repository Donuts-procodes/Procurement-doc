[project]
name = "rfq-backend"
version = "0.1.0"
description = "Docs RAG Clone API"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "pydantic-settings>=2.4.0",
    "langchain==0.3.7",
    "langchain-openai==0.2.6",
    "langchain-anthropic==0.2.4",
    "langchain-google-genai==2.0.4",
    "langgraph==0.2.45",
    "chromadb==0.5.18",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "python-multipart==0.0.12",
    "redis==5.0.3",
    "sqlalchemy==2.0.30",
    "psycopg2-binary==2.9.9",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
