[project]
name = "rfq-backend"
version = "0.1.0"
description = "Docs RAG Clone API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "langgraph>=0.1.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
